<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance & Student Tracking System</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1115;
    color: #eaeaea;
    text-align: center;
    margin: 0;
    padding: 30px 15px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }

    border: 3px solid #2a2d34;
    border-radius: 10px;
    overflow: hidden;
    max-width: 95%;
  }
  .video-wrapper img { display: block; max-width: 100%; }

<body>
  <h1>Smart Attendance & Student Tracking System</h1>
  <p class="subtitle">Auto Detect Mode — กล้องตัวเดียว ไม่ต้องกดปุ่มใดๆ ระบบทำงานอัตโนมัติทั้งหมด</p>

  <div class="video-wrapper">
    <img src="/video_feed" alt="Live Camera Feed">
  </div>
</body>
</html>
